name: OnCareTrainPreview
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
    CODE_SIGNING_REQUIRED: 'NO'
    MARKETING_VERSION: '0.4.24'
    CURRENT_PROJECT_VERSION: '29'
targets:
  CareSuiteNative:
    type: application
    platform: iOS
    sources:
      - PreviewApp.swift
      - ../Native/RideMotion.swift
      - ../Native/TrainInterior.swift
      - ../Native/CrowdComparison.swift
      - ../Native/TransitLookup.swift
      - path: ../Resources/train-cabin-warm-v1.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: OnCareTrainPreview
        PRODUCT_MODULE_NAME: CareSuiteNative
        PRODUCT_BUNDLE_IDENTIFIER: app.caresuite.trainpreview
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: OnCare 전철 미리보기
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        TARGETED_DEVICE_FAMILY: '1,2'
  PreviewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/RideMotionTests.swift
      - ../Tests/CrowdComparisonTests.swift
      - PreviewArtworkTests.swift
    dependencies:
      - target: CareSuiteNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.caresuite.trainpreview.tests
        GENERATE_INFOPLIST_FILE: 'YES'
  PreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PreviewUITests.swift]
    dependencies:
      - target: CareSuiteNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.caresuite.trainpreview.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  OnCareTrainPreview:
    build:
      targets:
        CareSuiteNative: all
    test:
      targets: [PreviewTests, PreviewUITests]
