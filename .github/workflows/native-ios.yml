name: OnCare native redesign iOS
on:
  workflow_dispatch:
  push:
    branches: [native-oncare]
permissions:
  contents: read
jobs:
  native-ios:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Generate native Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_native.py
          brew install xcodegen
          xcodegen generate
          pod install --repo-update
      - name: Build native device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace CareSuiteNative.xcworkspace -scheme CareSuiteNative -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > device-build.log 2>&1 || { tail -120 device-build.log; exit 1; }
          APP=build/device/Build/Products/Release-iphoneos/CareSuiteNative.app
          python3 tool/verify_native.py --app "$APP"
          mkdir -p delivery/Payload
          ditto "$APP" delivery/Payload/CareSuiteNative.app
          cd delivery
          zip -qry OnCare-Native-0.4.13-unsigned.ipa Payload
          shasum -a 256 *.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OnCare-Native-Device-IPA
          path: |
            delivery/*.ipa
            delivery/SHA256.txt
          if-no-files-found: error
      - name: Native regression and navigation tests
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for rows in d["devices"].values() for x in rows if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -workspace CareSuiteNative.xcworkspace -scheme CareSuiteNative -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/native-tests.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test > native-tests.log 2>&1 || { tail -150 native-tests.log; exit 1; }
          tail -35 native-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OnCare-Native-Validation
          path: |
            device-build.log
            native-tests.log
            build/native-tests.xcresult
            Podfile.lock
