name: OnCare train component preview
on:
  push:
    branches: [native-oncare]
    paths: ['Preview/**', '.github/workflows/train-preview-ios.yml', 'Native/RideMotion.swift', 'Native/TrainInterior.swift', 'Native/CrowdComparison.swift']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-preview:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build shared train components without ML dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          cd Preview
          xcodegen generate
          xcodebuild -project OnCareTrainPreview.xcodeproj -scheme OnCareTrainPreview -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build > device-build.log 2>&1 || { tail -100 device-build.log; exit 1; }
          mkdir -p delivery/Payload
          ditto build/device/Build/Products/Release-iphoneos/OnCareTrainPreview.app delivery/Payload/OnCareTrainPreview.app
          cd delivery
          zip -qry OnCare-Train-Preview-0.4.24-unsigned.ipa Payload
          shasum -a 256 *.ipa > SHA256.txt
      - name: Test calculations, artwork and native navigation
        timeout-minutes: 16
        shell: bash
        run: |
          set -euo pipefail
          cd Preview
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for rows in d["devices"].values() for x in rows if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project OnCareTrainPreview.xcodeproj -scheme OnCareTrainPreview -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/preview-tests.xcresult CODE_SIGNING_ALLOWED=NO test > preview-tests.log 2>&1 || { tail -120 preview-tests.log; exit 1; }
          tail -30 preview-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OnCare-Train-Preview
          path: |
            Preview/delivery/*.ipa
            Preview/delivery/SHA256.txt
            Preview/device-build.log
            Preview/preview-tests.log
            Preview/build/preview-tests.xcresult
